name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'nightly'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - 'default'
        include:
          - os: macOS-latest
            version: '1'
            arch: 'default'
          - os: windows-latest
            version: '1'
            arch: 'default'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      # Julia 1.10 ignores `[sources]`; develop workspace packages explicitly.
      - name: Develop the lib/ subpackages (Pkg < 1.11 ignores [sources])
        # Bash preserves the embedded quotes on Windows.
        shell: bash
        run: julia --project=. -e 'using Pkg; Pkg.develop([PackageSpec(path="lib/ZarrCore"), PackageSpec(path="lib/ZarrZip"), PackageSpec(path="lib/ZarrBlosc"), PackageSpec(path="lib/ZarrZlib"), PackageSpec(path="lib/ZarrZstd"), PackageSpec(path="lib/ZarrHTTP"), PackageSpec(path="lib/ZarrGCS"), PackageSpec(path="lib/ZarrS3"), PackageSpec(path="lib/ZarrTrimmable")])'
      - uses: julia-actions/julia-buildpkg@v1
        env:
          PYTHON:
      - name: Generate Julia and Python v3 fixtures
        uses: nick-fields/retry@v4
        env:
          PYTHON:
        with:
          timeout_minutes: 5
          max_attempts: 3
          # Bash preserves the embedded quotes on Windows.
          shell: bash
          command: |
            julia --project=test -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path="lib/ZarrCore"), PackageSpec(path="lib/ZarrZip"), PackageSpec(path="lib/ZarrBlosc"), PackageSpec(path="lib/ZarrZlib"), PackageSpec(path="lib/ZarrZstd"), PackageSpec(path="lib/ZarrHTTP"), PackageSpec(path="lib/ZarrGCS"), PackageSpec(path="lib/ZarrS3"), PackageSpec(path="lib/ZarrTrimmable")]); Pkg.resolve(); Pkg.instantiate()'
            julia --project=test test/v3_julia.jl
            julia --project=test test/v3_python.jl
      # Julia 1.10 cannot merge developed fixture packages into the test sandbox.
      - name: Drop the test manifest so Pkg.test can build its sandbox
        shell: bash
        run: rm -f test/Manifest.toml
      - uses: julia-actions/julia-runtest@v1
        env:
          PYTHON:
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: coverallsapp/github-action@v2
        if: matrix.os != 'macOS-latest'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: lcov.info
          flag-name: run-${{ join(matrix.*, '-') }}
          parallel: true
  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
