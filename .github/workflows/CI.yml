name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'nightly'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - 'default'
        include:
          - os: macOS-latest
            version: '1'
            arch: 'default'
          - os: windows-latest
            version: '1'
            arch: 'default'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      # Julia 1.10 ignores `[sources]`; develop sibling packages explicitly.
      - name: Develop the sibling packages (Pkg < 1.11 ignores [sources])
        # Bash preserves the embedded quotes on Windows.
        shell: bash
        run: julia --project=Zarr -e 'using Pkg; Pkg.develop([PackageSpec(path="ZarrCore"), PackageSpec(path="ZarrZip"), PackageSpec(path="ZarrBlosc"), PackageSpec(path="ZarrZlib"), PackageSpec(path="ZarrZstd"), PackageSpec(path="ZarrHTTP"), PackageSpec(path="ZarrGCS"), PackageSpec(path="ZarrS3")])'
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: Zarr
        env:
          PYTHON:
      - name: Generate Julia and Python v3 fixtures
        uses: nick-fields/retry@v4
        env:
          PYTHON:
        with:
          timeout_minutes: 5
          max_attempts: 3
          # Bash preserves the embedded quotes on Windows.
          shell: bash
          command: |
            julia --project=Zarr/test -e 'using Pkg; Pkg.develop([PackageSpec(path="Zarr"), PackageSpec(path="ZarrCore"), PackageSpec(path="ZarrZip"), PackageSpec(path="ZarrBlosc"), PackageSpec(path="ZarrZlib"), PackageSpec(path="ZarrZstd"), PackageSpec(path="ZarrHTTP"), PackageSpec(path="ZarrGCS"), PackageSpec(path="ZarrS3")]); Pkg.resolve(); Pkg.instantiate()'
            julia --project=Zarr/test Zarr/test/v3_julia.jl
            julia --project=Zarr/test Zarr/test/v3_python.jl
      # Julia 1.10 cannot merge developed fixture packages into the test sandbox.
      - name: Drop the test manifest so Pkg.test can build its sandbox
        shell: bash
        run: rm -f Zarr/test/Manifest.toml
      - uses: julia-actions/julia-runtest@v1
        with:
          project: Zarr
        env:
          PYTHON:
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: Zarr/src,ZarrCore/src,ZarrZip/src,ZarrBlosc/src,ZarrZlib/src,ZarrZstd/src,ZarrHTTP/src,ZarrGCS/src,ZarrS3/src
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: coverallsapp/github-action@v2
        if: matrix.os != 'macOS-latest'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: lcov.info
          flag-name: run-${{ join(matrix.*, '-') }}
          parallel: true
  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
